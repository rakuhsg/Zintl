name: Deno Check

on:
  pull_request:
    paths:
      - "libs/**/*.ts"
      - ".github/workflows/deno-check.yml"
  push:
    paths:
      - "libs/**/*.ts"
      - ".github/workflows/deno-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libs:
    name: Check libs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.0"

      - name: Check TypeScript libs
        run: deno check libs/*.ts
