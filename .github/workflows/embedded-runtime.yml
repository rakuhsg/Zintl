name: Embedded Runtime

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/embedded-runtime.yml"
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/embedded-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: bash runtime/scripts/check-architecture.sh
      - run: cargo fmt --manifest-path runtime/Cargo.toml --check
      - run: cargo clippy --manifest-path runtime/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path runtime/Cargo.toml --workspace --all-features
      - run: cc -std=c11 -Wall -Wextra -Werror -Iruntime/include -fsyntax-only runtime/tests/integration/ffi_header.c

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path runtime/Cargo.toml -p runtime-ffi
      - run: swift format lint --strict --recursive runtime/swift/Sources runtime/swift/Tests
      - run: swift format lint --strict --recursive runtime/examples/PermissionReplDemo
      - run: swift build --package-path runtime/swift
      - run: swift test --package-path runtime/swift
      - run: swift test --package-path runtime/examples/PermissionReplDemo

  fuzz:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz bounded security parsers and state machines
        working-directory: runtime/fuzz
        run: |
          for target in ffi_op_decoder path_parser resource_operations; do
            cargo fuzz run "$target" -- \
              -max_total_time=30 -max_len=65536 -timeout=5 -rss_limit_mb=2048
          done

  rust-address-sanitizer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Test Rust workspace with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          target=$(rustc +nightly -vV | sed -n 's/^host: //p')
          cargo +nightly test --manifest-path runtime/Cargo.toml \
            --workspace --all-features -Zbuild-std --target "$target"

  swift-sanitizers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path runtime/Cargo.toml -p runtime-ffi
      - run: swift test --sanitize address --package-path runtime/swift
      - run: swift package --package-path runtime/swift clean
      - run: swift test --sanitize thread --package-path runtime/swift
