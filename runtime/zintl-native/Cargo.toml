[package]
name = "zintl-native"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
futures = "0.3"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
wgpu = { version = "28", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
zpd-appkit = { path = "../../platform/zpd-appkit" }

[features]
wgpu = ["dep:wgpu", "zpd-appkit/wgpu"]
