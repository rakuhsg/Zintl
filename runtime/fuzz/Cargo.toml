[package]
name = "runtime-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
runtime-core = { path = "../crates/runtime-core" }
runtime-ffi = { path = "../crates/runtime-ffi" }
runtime-filesystem = { path = "../crates/runtime-filesystem" }
runtime-resource = { path = "../crates/runtime-resource" }

[[bin]]
name = "ffi_op_decoder"
path = "fuzz_targets/ffi_op_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_parser"
path = "fuzz_targets/path_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resource_operations"
path = "fuzz_targets/resource_operations.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
